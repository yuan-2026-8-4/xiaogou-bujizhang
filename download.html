<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小狗不记账 · 最新版下载</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 600px at 50% -10%,#3a2a1c 0%,#17120f 60%,#0e0b09 100%);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#f5ede3}
  .card{width:min(88vw,420px);padding:28px 24px;border-radius:20px;text-align:center;
    background:rgba(44,34,27,.9);border:1px solid rgba(239,192,138,.25);
    box-shadow:0 24px 60px rgba(0,0,0,.45)}
  h1{margin:0 0 10px;font-size:20px;color:#efc08a}
  p{margin:8px 0;font-size:14px;line-height:1.7;color:#cdbba6}
  .btn{display:inline-block;margin-top:16px;padding:12px 22px;border-radius:14px;
    background:linear-gradient(180deg,#efc08a,#c9894d);color:#2a1b0e;font-weight:700;
    text-decoration:none;font-size:15px}
  .tip{margin-top:14px;font-size:12px;color:#9a8a79}
</style>
</head>
<body>
  <div class="card">
    <h1>小狗不记账 <span id="ver">最新版</span></h1>
    <p>正在获取最新版本，随后自动下载 <b>带版本号</b> 的安装包…</p>
    <p>如果没有自动开始，请点下面的按钮。</p>
    <a class="btn" id="btn" href="apk/xiaogou-v2.7.1.apk" download="小狗不记账-v2.7.1.apk">下载最新安装包</a>
    <p class="tip" id="tip">安卓 · 约 17 MB · 安装即用</p>
  </div>
  <script>
  (function () {
    var FALLBACK_VERSION = '2.7.1';
    var API = 'https://api.github.com/repos/yuan-2026-8-4/xiaogou-bujizhang/contents/apk?ref=gh-pages';

    function go(version) {
      var fileName = 'xiaogou-v' + version + '.apk';
      var btn = document.getElementById('btn');
      document.getElementById('ver').textContent = 'v' + version;
      btn.textContent = '下载 v' + version + ' 安装包';
      btn.href = 'apk/' + fileName;
      btn.setAttribute('download', '小狗不记账-v' + version + '.apk');
      document.getElementById('tip').textContent = '版本 v' + version + ' · 安卓 · 约 17 MB';
      setTimeout(function () { location.replace('apk/' + fileName); }, 450);
    }

    function compare(a, b) {
      var A = a.split('.').map(Number), B = b.split('.').map(Number);
      for (var i = 0; i < Math.max(A.length, B.length); i++) {
        var d = (B[i] || 0) - (A[i] || 0);
        if (d) return d;
      }
      return 0;
    }

    if (!window.fetch) { go(FALLBACK_VERSION); return; }

    fetch(API, { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (list) {
        var versions = (list || []).map(function (item) { return item && item.name; })
          .map(function (name) {
            var m = /^xiaogou-v(\d+(?:\.\d+)+)\.apk$/.exec(name || '');
            return m ? m[1] : null;
          })
          .filter(Boolean);
        if (!versions.length) throw new Error('no version found');
        versions.sort(compare);
        go(versions[0]);
      })
      .catch(function () { go(FALLBACK_VERSION); });
  })();
  </script>
</body>
</html>
